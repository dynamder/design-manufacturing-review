<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="generator" content="scripts/build.mjs">
<title>{{TITLE}}</title>
<style>
{{CSS}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<div class="kicker">{{KICKER}}</div>
<h1>{{HEADING}}</h1>
<p class="sub">{{SUBTITLE}}</p>
<p class="hint">{{HINT}}</p>
<button class="printbtn" type="button" onclick="window.print()">打印 / 存 PDF</button>
</div></header>
<div class="layout">
<aside class="sidebar">
{{TOC}}
</aside>
<main class="content">
{{BODY}}
</main>
</div>
<footer>{{FOOTER}}</footer>
<script>
window.MathJax = {
  tex: { inlineMath: [["$", "$"]], displayMath: [["$$", "$$"]] },
  svg: { fontCache: "global" },
  options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
};
</script>
<script async src="vendor/mathjax/tex-svg.js"></script>
<script>
document.querySelectorAll(".content img").forEach(function (im) {
  im.title = "点击查看原图";
  im.addEventListener("click", function () { window.open(im.src, "_blank"); });
});
</script>
</body>
</html>
