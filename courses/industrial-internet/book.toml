[book]
title = "工业互联网基础"
authors = ["dynamder"]
language = "zh-CN"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
mathjax-support = false
git-repository-url = "https://github.com/dynamder/design-manufacturing-review"
edit-url-template = "https://github.com/dynamder/design-manufacturing-review/edit/main/courses/industrial-internet/src/{path}"
additional-css = ["theme/course.css"]
additional-js = ["theme/course.js"]

[output.html.search]
enable = true
