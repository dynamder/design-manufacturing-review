[book]
title = "设计与制造 1"
authors = ["dynamder"]
language = "zh-CN"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
mathjax-support = false
git-repository-url = "https://github.com/dynamder/design-manufacturing-review"
edit-url-template = "https://github.com/dynamder/design-manufacturing-review/edit/main/courses/dm1/src/{path}"
additional-css = ["theme/course.css"]
additional-js = ["theme/course.js"]

[output.html.search]
enable = true
